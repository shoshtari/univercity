[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "unipick"
version = "0.0.1"
dependencies = [
    "bcrypt==5.0.0",
    "black==26.1.0",
    "cachetools==7.0.5",
    "flask==3.1.3",
    "flask-compress==1.24",
    "flask-cors==6.0.2",
    "ipykernel==7.2.0",
    "ipython==9.10.0",
    "jdatetime==5.2.0",
    "mypy==1.20.0",
    "mypy-extensions==1.1.0",
    "pdfplumber==0.11.9",
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",
    "pyjwt==2.12.1",
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "rich==14.3.3",
    "ruff==0.15.10",
    "snakeviz==2.2.2",
    "sqlalchemy==2.0.46",
    "structlog==25.5.0",
    "typer==0.24.1",
    "types-cachetools==6.2.0.20260408",
    "types-flask-cors==6.0.0.20260408",
    "types-waitress==3.0.1.20260408",
    "typing-extensions==4.15.0",
    "waitress==3.0.2",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
lint.select = ["F", "I"]  # F401 = unused imports
fix = true

[tool.ruff.format]
quote-style = "double"

[tool.black]
line-length = 88

[tool.mypy]
strict = true
exclude = "^(venv|tests)/"
mypy_path = "typings"

[tool.pytest]
strict = true
console_output_style = "progress"

[[tool.mypy.overrides]]
module = "jdatetime.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "common.configs"
disable_error_code = ["call-arg"]
