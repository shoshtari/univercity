# Paper-reproduction configuration for 2x super-resolution.
model:
  scale: 2
  channels: 50
  num_groups: 4
  blocks_per_group: 4
  modulation_kernel: 11
  projection_kernel: 3
  mlp_ratio: 2
  use_modulation: true
  use_gating: true
  use_mlp: true
  use_group_conv: true
  use_esa: true
  layer_scale_init: 1.0e-6

data:
  # Full paper data: 800 DIV2K training images and Set5 for sample validation.
  train_hr_dir: data/dataset/DIV2K/DIV2K_train_HR
  train_lr_dir: data/dataset/DIV2K/DIV2K_train_LR_bicubic/X2
  val_hr_dir: data/dataset/benchmarks/Set5/GTmod12
  val_lr_dir: data/dataset/benchmarks/Set5/LRbicx2
  hr_patch_size: 96
  augment: true
  repeat: 1
  num_workers: 4

training:
  epochs: 100
  batch_size: 32
  learning_rate: 0.0005
  beta1: 0.9
  beta2: 0.99
  epsilon: 1.0e-8
  loss: l1
  lr_step_epochs: 200
  lr_gamma: 0.5
  gradient_clip: null
  warm_start_checkpoint: null
  log_interval: 10
  validation_interval: 10
  resume_checkpoint: null

evaluation:
  channel: y
  shave_border: scale
  save_images: 2

runtime:
  device: auto
  seed: 810104039
  deterministic: true

paths:
  saved_models_dir: models/saved_models
  output_dir: outputs

# This section is enabled only by --quick and retains the full 881,912-parameter architecture.
quick:
  train_hr_dir: data/dataset/demo/train_hr
  train_lr_dir: null
  val_hr_dir: data/dataset/demo/val_hr
  val_lr_dir: null
  hr_patch_size: 48
  max_train_images: 8
  max_val_images: 4
  repeat: 2
  batch_size: 2
  num_workers: 0
  epochs: 2
  max_batches_per_epoch: 4
